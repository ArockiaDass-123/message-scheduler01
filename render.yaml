services:
  # Backend FastAPI API Service
  - type: web
    name: arockiadass-scheduler-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./scheduler.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: bXlzZWNyZXRrZXkxMjM0NTY3ODkwMTI=
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

  # Frontend React Vite Static Site
  - type: web
    name: arockiadass-scheduler-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: arockiadass-scheduler-backend
          property: host

